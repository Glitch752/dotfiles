[configurations.misc]
render = [
    # { source = "hicolor-fix.theme", destination = "~/.local/share/icons/hicolor/index.theme", action = "copy" }
    { source = "steam-wrapper.sh", destination = "/usr/local/bin/steam", as = "root", owner = "kit", permissions = "755" },
    { source = "steam.desktop", destination = "~/.local/share/applications/steam.desktop" },
    { source = "mimeapps.list", destination = "~/.local/share/applications/mimeapps.list" },

    # TODO: This could presumably be a wireplumber policy?
    { source = "systemd/set-audio-profile.service", destination = "~/.config/systemd/user/set-audio-profile.service" },
    # TODO: Post-update script `systemctl --user daemon-reload` and `systemctl --user enable --now set-audio-profile.service`

    { source = "pacman.conf", destination = "/etc/pacman.conf", as = "root", owner = "root", permissions = "644" }
]

# TODO: Post-render script update-desktop-database ~/.local/share/applications/